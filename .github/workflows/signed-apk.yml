name: Build signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ vars.JAVA_VERSION || '17' }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check host features
        run: bash tests/run.sh
      - name: Build with private signing credentials
        shell: bash
        env:
          MUSIC_KEYSTORE_BASE64: ${{ secrets.MUSIC_KEYSTORE_BASE64 }}
          MUSIC_STORE_PASSWORD: ${{ secrets.MUSIC_STORE_PASSWORD }}
          MUSIC_KEY_PASSWORD: ${{ secrets.MUSIC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          for name in MUSIC_KEYSTORE_BASE64 MUSIC_STORE_PASSWORD MUSIC_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          export MUSIC_SIGNING_KEY="$RUNNER_TEMP/simple-player-signing.keystore"
          trap 'rm -f -- "$MUSIC_SIGNING_KEY"' EXIT
          printf '%s' "$MUSIC_KEYSTORE_BASE64" | base64 --decode > "$MUSIC_SIGNING_KEY"
          unset MUSIC_KEYSTORE_BASE64
          test -s "$MUSIC_SIGNING_KEY"
          bash build.sh
      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Simple-Player-signed
          path: build/Simple Player.apk
          if-no-files-found: error
